name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shaders
        shell: pwsh
        run: |
          $src = Get-Content src/shaders.h -Raw
          $hlsl = [regex]::Match($src, '(?s)R"HLSL\((.*)\)HLSL"').Groups[1].Value
          Set-Content relais.hlsl $hlsl
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" | Sort-Object FullName | Select-Object -Last 1
          & $fxc.FullName /nologo /T vs_4_0 /E VSMain /Fo vs.cso relais.hlsl; if ($LASTEXITCODE) { exit 1 }
          & $fxc.FullName /nologo /T ps_4_0 /E PSDecode /D PASS_DECODE=1 /Fo d.cso relais.hlsl; if ($LASTEXITCODE) { exit 1 }
          & $fxc.FullName /nologo /T ps_4_0 /E PSPicture /D PASS_PICTURE=1 /Fo p.cso relais.hlsl; if ($LASTEXITCODE) { exit 1 }
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: relais
          path: build/Release/relais.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Release/relais.exe
